name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify implementation baseline
        shell: pwsh
        run: ./scripts/verify-baseline-spec.ps1
      - name: Verify app policy
        shell: pwsh
        run: ./scripts/test-app-policy.ps1
      - name: Verify release policy guard
        shell: pwsh
        run: ./scripts/test-release-policy.ps1
      - name: Verify architecture boundaries
        shell: pwsh
        run: ./scripts/test-architecture.ps1
      - name: Check, lint, and assemble debug APK
        run: ./gradlew check lint assembleDebug
      - name: Verify S01 APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose spikes/probe-suite/build/outputs/apk/debug/probe-suite-debug.apk
      - name: Verify release artifact policy
        shell: pwsh
        run: ./scripts/verify-release-policy.ps1
