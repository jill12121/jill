name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify implementation baseline
        shell: pwsh
        run: ./scripts/verify-baseline-spec.ps1
      - name: Verify app policy
        shell: pwsh
        run: ./scripts/test-app-policy.ps1
      - name: Lint
        run: ./gradlew lint
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
