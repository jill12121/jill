[versions]
agp = "8.7.3"
kotlin = "2.0.21"
konsist = "0.17.3"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
compileSdk = "35"
minSdk = "30"
targetSdk = "35"
activityCompose = "1.10.0"
